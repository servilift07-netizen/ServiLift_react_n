erse"><path d="M0,0 L10,5 L0,10 z" fill="#fca5a5"/></marker></defs><rect width="1100" height="470" rx="14" fill="#141925"/><text x="550.0" y="34" font-size="22" font-weight="700" fill="#f3f4f6" text-anchor="middle" dominant-baseline="central">Mutación manual: ¿mis tests detectan este defecto?</text><path d="M 270.0 175.0 L 330.0 175.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 560.0 175.0 L 620.0 175.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 740.0 250.0 L 740.0 290.0 L 580.0 290.0 L 580.0 330.0" fill="none" stroke="#f87171" stroke-width="1.6" marker-end="url(#mf87171)"/><path d="M 860.0 175.0 L 925.0 175.0 L 925.0 330.0" fill="none" stroke="#4ade80" stroke-width="1.6" marker-end="url(#m4ade80)"/><path d="M 430.0 385.0 L 155.0 385.0 L 155.0 230.0" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m94a3b8)"/><rect x="40" y="120" width="230" height="110" rx="10" fill="#1e2440" stroke="#6366f1" stroke-width="1.6"/><text x="155.0" y="156.1" font-size="15" fill="#eef2ff" font-weight="600" text-anchor="middle" dominant-baseline="central">1. Muta el código</text><text x="155.0" y="178.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">&gt; por &gt;= , borra un trim(), invierte</text><text x="155.0" y="195.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">una condición</text><rect x="330" y="120" width="230" height="110" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="445.0" y="164.6" font-size="15" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">2. Corre los tests</text><text x="445.0" y="186.8" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">toda la suite</text><polygon points="740,100.0 860.0,175 740,250.0 620.0,175" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="740.0" y="175.0" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">¿Algún test falla?</text><rect x="430" y="330" width="300" height="110" rx="10" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="580.0" y="366.1" font-size="15" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Mutante sobrevive ✗</text><text x="580.0" y="388.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Falta un caso. Escribe el test que falla con la</text><text x="580.0" y="405.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">mutación.</text><rect x="780" y="330" width="290" height="110" rx="10" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="925.0" y="366.1" font-size="15" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">Mutante eliminado ✓</text><text x="925.0" y="388.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Tus tests protegen esa regla. Deshaz la</text><text x="925.0" y="405.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">mutación.</text><rect x="717.9" y="280.0" width="28.2" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="732.0" y="290.0" font-size="12" fill="#f87171" font-weight="400" text-anchor="middle" dominant-baseline="central">No</text><rect x="913.7" y="254.0" width="22.6" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="925.0" y="264.0" font-size="12" fill="#4ade80" font-weight="400" text-anchor="middle" dominant-baseline="central">Sí</text><rect x="202.8" y="375.0" width="110.5" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="258.0" y="385.0" font-size="12" fill="#94a3b8" font-weight="400" text-anchor="middle" dominant-baseline="central">y vuelve a probar</text></svg>