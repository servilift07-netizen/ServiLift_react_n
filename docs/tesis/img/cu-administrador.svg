125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="196.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Ingresar correo y contraseña</text><ellipse cx="780" cy="246.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="246.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Validar rol y estado activo</text><ellipse cx="780" cy="296.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="296.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Cambiar contraseña</text><ellipse cx="430" cy="443.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="443.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-02: Gestionar usuarios</text><ellipse cx="780" cy="368.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="368.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Registrar usuario con rol</text><ellipse cx="780" cy="418.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="418.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Crear acceso al portal del cliente</text><ellipse cx="780" cy="468.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="468.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Editar datos y cargo</text><ellipse cx="780" cy="518.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="518.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Activar, inactivar o bloquear</text><el