16.1" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">cliente</text><polygon points="435.0,380.0 550.0,425 435.0,470.0 320.0,425" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="435.0" y="416.9" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">¿Aprueba la</text><text x="435.0" y="433.1" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">cotización?</text><rect x="330.0" y="510" width="210" height="44" rx="10" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="435.0" y="532.0" font-size="12.5" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Rechazada: fin</text><rect x="80.0" y="510" width="210" height="56" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="185.0" y="529.9" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Aceptar y enviar a</text><text x="185.0" y="546.1" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">programación</text><rect x="580.0" y="610" width="210" height="56" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="685.0" y="638.0" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Asignar inspector, fecha y hora</text><rect x="830.0" y="710" width="210" height="70" rx="10" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="935.0" y="736.9" font-size="12.5" fill="#fef3c7" font-weight="600" text-anchor="middle" dominant-baseline="central">Inspección: datos, checklist,</text><text x="935.0" y="753.1" font-size="12.5" fill="#fef3c7" font-weight="600" text-anchor="middle" dominant-baseline="central">fotos y firmas (con o sin señal)</text><rect x="830.0" y="820" width="210" height="56" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="935.0" y="839.9" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Finalizar: genera el informe de</text><text x="935.0" y="856.1" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">la visita</text><rect x="1080.0" y="920" width="210" height="56" rx="10" fill="#3f1530" stroke="#ec4899" stroke-width="1.6"/><text x="1185.0" y="948.0" font-size="12.5" fill="#fce7f3" font-weight="600" text-anchor="middle" dominant-baseline="central">Revisar informe</text><rect x="830.0" y="920" width="210" height="56" rx="10" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="935.0" y="948.0" font-size="12.5" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Devuelto: corregir</text><text x="1080.0" y="910.0" font-size="11" fill="#f87171" font-weight="400" text-anchor="start" dominant-baseline="central">Devolver</text><polygon points="1185.0,1020.0 1300.0,1065 1185.0,1110.0 1070.0,1065" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="1185.0" y="1056.9" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">¿Concepto</text><text x="1185.0" y="1073.1" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">conforme?</text><rect x="1330.0" y="1140" width="210" height="56" rx="10" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="1435.0" y="1168.0" font-size="12.5" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">Elaborar certificado con QR</text><rect x="1330.0" y="1230" width="210" height="56" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="1435.0" y="1258.0" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Enviar al cliente</text><circle cx="1435.0" cy="1322" r="12" fill="none" stroke="#e5e7eb" stroke-width="2"/><circle cx="1435.0" cy="1322" r="7" fill="#e5e7eb"/><polygon points="1185.0,1150.0 1300.0,1195 1185.0,1240.0 1070.0,1195" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="1185.0" y="1195.0" font-size="12.5" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">¿Era la 2ª visita?</text><rect x="1080.0" y="1280" width="210" height="66" rx="10" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="1185.0" y="1304.9" font-size="12.5" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Cerrado no conforme: requiere</text><text x="1185.0" y="1321.1" font-size="12.5" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">cotización nueva</text><rect x="330.0" y="1280" width="210" height="56" rx="10" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="435.0" y="1299.9" font-size="12.5" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">Solicitar 2ª visita dentro del</text><text x="435.0" y="1316.1" font-size="12.5" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">plazo</text><text x="800.0" y="1382.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Solo existen dos visitas por servicio. Cada visita tiene su informe, revisión, firma y PDF.</text><rect x="421.6" y="480.0" width="26.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="435.0" y="490.0" font-size="11" fill="#f87171" font-weight="400" text-anchor="middle" dominant-baseline="central">No</text><rect x="243.1" y="415.0" width="21.7" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="254.0" y="425.0" font-size="11" fill="#4ade80" font-weight="400" text-anchor="middle" dominant-baseline="central">Sí</text><rect x="1352.1" y="1055.0" width="21.7" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="1363.0" y="1065.0" font-size="11" fill="#4ade80" font-weight="400" text-anchor="middle" dominant-baseline="central">Sí</text><rect x="1171.6" y="1120.0" width="26.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="1185.0" y="1130.0" font-size="11" fill="#f87171" font-weight="400" text-anchor="middle" dominant-baseline="central">No</text><rect x="1174.1" y="1250.0" width="21.7" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="1185.0" y="1260.0" font-size="11" fill="#f87171" font-weight="400" text-anchor="middle" dominant-baseline="central">Sí</text><rect x="738.9" y="1185.0" width="158.3" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="818.0" y="1195.0" font-size="11" fill="#f87171" font-weight="400" text-anchor="middle" dominant-baseline="central">No: hay plazo de corrección</text><rect x="658.1" y="1049.5" width="53.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="685.0" y="1059.5" font-size="11" fill="#c4b5fd" font-weight="400" text-anchor="middle" dominant-baseline="central">2ª visita</text></svg>