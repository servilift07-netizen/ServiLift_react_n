rker-end="url(#mf9a8d4)"/><path d="M 740.0 250.0 L 740.0 270.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 740.0 480.0 L 740.0 500.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 740.0 580.0 L 740.0 600.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><text x="220.0" y="136.0" font-size="16" fill="#93c5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">Clientes (servilift-app)</text><rect x="70" y="170" width="300" height="120" rx="10" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="220.0" y="219.6" font-size="15" fill="#fef3c7" font-weight="600" text-anchor="middle" dominant-baseline="central">App en el celular</text><text x="220.0" y="241.8" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Android / iOS con Expo · Inspector en campo</text><rect x="70" y="310" width="300" height="120" rx="10" fill="#0f3534" stroke="#14b8a6" stroke-width="1.6"/><text x="220.0" y="351.1" font-size="15" fill="#ccfbf1" font-weight="600" text-anchor="middle" dominant-baseline="central">App en el navegador</text><text x="220.0" y="373.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Expo web · Asesor, programación, director,</text><text x="220.0" y="390.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">certificados, administrador y cliente</text><rect x="70" y="450" width="300" height="70" rx="10" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="220.0" y="475.2" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Cola sin conexión</text><text x="220.0" y="496.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">AsyncStorage + motor de sincronización</text><rect x="70" y="540" width="300" height="70" rx="10" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="220.0" y="565.2" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Sesión segura</text><text x="220.0" y="586.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">SecureStore (celular) · sessionStorage (web)</text><rect x="70" y="630" width="300" height="110" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="220.0" y="675.9" font-size="13" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">React Native 0.86 · Expo SDK 57</text><text x="220.0" y="695.4" font-size="11" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">TypeScript · Expo Router · React Native Paper</text><text x="740.0" y="136.0" font-size="16" fill="#93c5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">API REST (servilift-backend)</text><rect x="510" y="170" width="460" height="80" rx="10" fill="#1e2440" stroke="#6366f1" stroke-width="1.6"/><text x="740.0" y="191.1" font-size="15" fill="#eef2ff" font-weight="600" text-anchor="middle" dominant-baseline="central">Rutas por módulo · FastAPI</text><text x="740.0" y="213.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">auth, usuarios, clientes, cotizaciones, programación, inspecciones,</text><text x="740.0" y="230.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">informes, certificados…</text><rect x="510" y="270" width="220" height="90" rx="10" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="620.0" y="297.4" font-size="14" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Seguridad</text><text x="620.0" y="318.3" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">JWT, PBKDF2, permisos por rol,</text><text x="620.0" y="333.9" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">enlaces firmados</text><rect x="750" y="270" width="220" height="90" rx="10" fill="#2a1d45" stroke="#a855f7" stroke-width="1.6"/><text x="860.0" y="297.4" font-size="14" fill="#f3e8ff" font-weight="600" text-anchor="middle" dominant-baseline="central">Validación</text><text x="860.0" y="318.3" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Pydantic 2 · esquemas de entrada</text><text x="860.0" y="333.9" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">y salida</text><rect x="510" y="380" width="460" height="100" rx="10" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="740.0" y="411.1" font-size="15" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">Servicios de negocio</text><text x="740.0" y="433.3" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">flujo (estados y consecutivos) · checklist (aplicabilidad) · reglas · pdf ·</text><text x="740.0" y="450.2" font-size="13" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">archivos</text><rect x="510" y="500" width="220" height="80" rx="10" fill="#3f1530" stroke="#ec4899" stroke-width="1.6"/><text x="620.0" y="530.2" font-size="14" fill="#fce7f3" font-weight="600" text-anchor="middle" dominant-baseline="central">Generador PDF</text><text x="620.0" y="551.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">ReportLab + QR</text><rect x="750" y="500" width="220" height="80" rx="10" fill="#3f1530" stroke="#ec4899" stroke-width="1.6"/><text x="860.0" y="530.2" font-size="14" fill="#fce7f3" font-weight="600" text-anchor="middle" dominant-baseline="central">Archivos</text><text x="860.0" y="551.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Pillow · fotos, firmas y PDF</text><rect x="510" y="600" width="460" height="70" rx="10" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="740.0" y="625.2" font-size="14" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">Modelos ORM · SQLAlchemy 2</text><text x="740.0" y="646.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">31 tablas mapeadas en models.py</text><rect x="510" y="690" width="460" height="60" rx="10" fill="#1d2432" stroke="#2f3a4d" stroke-width="1.6"/><text x="740.0" y="720.0" font-size="13" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Python 3.13 · uv · Alembic (migraciones 0001 a 0005)</text><text x="1270.0" y="136.0" font-size="16" fill="#93c5fd" font-weight="600" text-anchor="middle" dominant-baseline="central">Datos</text><rect x="1110" y="170" width="320" height="170" rx="10" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="1270.0" y="234.8" font-size="16" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">MariaDB 10.11</text><text x="1270.0" y="258.3" font-size="14" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">servilift_db · utf8mb4 · hora de Colombia ·</text><text x="1270.0" y="276.5" font-size="14" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Docker, puerto 3307</text><rect x="1110" y="360" width="320" height="90" rx="10" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="1270.0" y="395.2" font-size="14" fill="#e5e7eb" font-weight="600" text-anchor="middle" dominant-baseline="central">Base de pruebas</text><text x="1270.0" y="416.1" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">servilift_v2_prueba (integración y E2E)</text><rect x="1110" y="470" width="320" height="110" rx="10" fill="#3f1530" stroke="#ec4899" stroke-width="1.6"/><text x="1270.0" y="507.4" font-size="14" fill="#fce7f3" font-weight="600" text-anchor="middle" dominant-baseline="central">Almacenamiento de archivos</text><text x="1270.0" y="528.3" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">carpeta storage/: fotos, firmas y PDF; se sirven solo</text><text x="1270.0" y="543.9" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">con enlace firmado</text><rect x="1110" y="600" width="320" height="150" rx="10" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="1270.0" y="657.4" font-size="14" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">Verificación pública</text><text x="1270.0" y="678.3" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">El QR del certificado abre /verificar/{codigo} sin</text><text x="1270.0" y="693.9" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">iniciar sesión</text><rect x="398.8" y="305.0" width="112.4" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="455.0" y="315.0" font-size="11" fill="#a5b4fc" font-weight="400" text-anchor="middle" dominant-baseline="central">HTTP/JSON + JWT</text><rect x="992.0" y="409.0" width="95.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="1040.0" y="419.0" font-size="11" fill="#7dd3fc" font-weight="400" text-anchor="middle" dominant-baseline="central">SQL (PyMySQL)</text></svg>