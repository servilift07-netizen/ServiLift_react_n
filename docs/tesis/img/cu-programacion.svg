cción incluida o extendida</text><path d="M 697.2 148.0 L 727.2 148.0" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m22c55e)"/><text x="737.2" y="148.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start" dominant-baseline="central">«include» obligatoria</text><path d="M 889.5 148.0 L 919.5 148.0" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mf59e0b)"/><text x="929.5" y="148.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start" dominant-baseline="central">«extend» opcional</text><g stroke="#e5e7eb" stroke-width="2.2" fill="none"><circle cx="120" cy="406.0" r="13"/><line x1="120" y1="419.0" x2="120" y2="456.0"/><line x1="96" y1="432.0" x2="144" y2="432.0"/><line x1="120" y1="456.0" x2="102" y2="486.0"/><line x1="120" y1="456.0" x2="138" y2="486.0"/></g><text x="120.0" y="504.0" font-size="14" fill="#f3f4f6" font-weight="600" text-anchor="middle" dominant-baseline="central">Programación</text><ellipse cx="430" cy="246.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="246.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-01: Iniciar sesión</text><ellipse cx="780" cy="196.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="196.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Ingresar correo y contraseña</text><ellipse cx="780" cy="246.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="246.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Validar rol y estado activo</text><ellipse cx="780" cy="296.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="296.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Cambiar contraseña</text><ellipse cx="430" cy="418.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="418.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-10: Programar visita</text><ellipse cx="780" cy="368.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="368.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Elegir inspector</text><ellipse cx="780" cy="418.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="418.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Elegir fecha y hora</text><ellipse cx="780" cy="468.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="468.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Validar que no sea un día pasado</text><ellipse cx="430" cy="565.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="556.5" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-11: Reprogramar o cancelar</text><text x="430.0" y="573.4" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">visita</text><ellipse cx="780" cy="540.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="540.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Registrar motivo del cambio</text><ellipse cx="780" cy="590.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="590.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Devolver equipo a por programar</text><ellipse cx="430" cy="687.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="678.5" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-23: Consultar seguimiento</text><text x="430.0" y="695.4" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">e historial</text><ellipse cx="780" cy="662.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="654.2" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Filtrar por cotización, cliente o</text><text x="780.0" y="669.8" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">estado</text><ellipse cx="780" cy="712.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="712.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Ver historial de estados</text><text x="550.0" y="786.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Además, todos los roles con sesión usan CU-26 Consultar tablero e indicadores y CU-27 Recibir notificaciones.</text><rect x="577.5" y="211.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="221.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="577.5" y="236.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="246.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="578.5" y="261.0" width="55.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="271.0" font-size="10" fill="#f59e0b" font-weight="400" text-anchor="middle" dominant-baseline="central">«extend»</text><rect x="577.5" y="383.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text