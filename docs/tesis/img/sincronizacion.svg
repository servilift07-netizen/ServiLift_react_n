font-size="13" fill="#eef2ff" font-weight="600" text-anchor="middle" dominant-baseline="central">Motor de sincronización</text><rect x="947" y="100" width="190" height="56" rx="10" fill="#0f3534" stroke="#14b8a6" stroke-width="1.6"/><text x="1042.0" y="128.0" font-size="13" fill="#ccfbf1" font-weight="600" text-anchor="middle" dominant-baseline="central">API FastAPI</text><rect x="1175" y="100" width="190" height="56" rx="10" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="1270.0" y="128.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">MariaDB</text><path d="M 130.0 190.0 L 358.0 190.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#mcbd5e1)"/><path d="M 358.0 238.0 L 586.0 238.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#mcbd5e1)"/><path d="M 586.0 286.0 L 358.0 286.0" fill="none" stroke="#86efac" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m86efac)"/><rect x="496" y="320" width="864" height="34" rx="10" fill="#232a38" stroke="#4b5563" stroke-width="1.6"/><text x="928.0" y="337.0" font-size="12" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">El motor se activa al guardar, al volver la red, al abrir la app y cada 30 s</text><path d="M 814.0 380.0 L 586.0 380.0" fill="none" stroke="#cbd5e1" stroke-width="1.6" marker-end="url(#mcbd5e1)"/><text x="60.0" y="422.0" font-size="12" fill="#86efac" font-weight="600" text-anchor="start" dominant-baseline="central">[hay señal]</text><path d="M 814.0 428.0 L 1042.0 428.0" fill="none" stroke="#a5b4fc" stroke-width="1.6" marker-end="url(#ma5b4fc)"/><path d="M 1042.0 476.0 L 1270.0 476.0" fill="none" stroke="#7dd3fc" stroke-width="1.6" marker-end="url(#m7dd3fc)"/><path d="M 1042.0 524.0 L 814.0 524.0" fill="none" stroke="#86efac" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m86efac)"/><path d="M 814.0 572.0 L 586.0 572.0" fill="none" stroke="#86efac" stroke-width="1.6" marker-end="url(#m86efac)"/><text x="60.0" y="614.0" font-size="12" fill="#fcd34d" font-weight="600" text-anchor="start" dominant-baseline="central">[sin señal]</text><path d="M 814.0 620.0 L 586.0 620.0" fill="none" stroke="#fcd34d" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mfcd34d)"/><text x="60.0" y="662.0" font-size="12" fill="#fca5a5" font-weight="600" text-anchor="start" dominant-baseline="central">[error del servidor]</text><path d="M 814.0 668.0 L 586.0 668.0" fill="none" stroke="#fca5a5" stroke-width="1.6" marker-end="url(#mfca5a5)"/><path d="M 586.0 716.0 L 358.0 716.0" fill="none" stroke="#fca5a5" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mfca5a5)"/><rect x="496" y="750" width="864" height="34" rx="10" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="928.0" y="767.0" font-size="12" fill="#dcfce7" font-weight="400" text-anchor="middle" dominant-baseline="central">Fotos y firmas llevan uuid_offline: un reenvío no se duplica. Finalizar exige la cola vacía.</text><rect x="151.0" y="169.0" width="186.0" height="19" rx="4" fill="#141925"/><text x="244.0" y="179.0" font-size="12" fill="#cbd5e1" font-weight="400" text-anchor="middle" dominant-baseline="central">Califica ítem, toma foto o firma</text><rect x="363.1" y="217.0" width="217.8" height="19" rx="4" fill="#141925"/><text x="472.0" y="227.0" font-size="12" fill="#cbd5e1" font-weight="400" text-anchor="middle" dominant-baseline="central">Guarda la operación con hora y uuid</text><rect x="390.9" y="265.0" width="162.1" height="19" rx="4" fill="#141925"/><text x="472.0" y="275.0" font-size="12" fill="#86efac" font-weight="400" text-anchor="middle" dominant-baseline="central">«Guardado en el teléfono»</text><rect x="605.0" y="359.0" width="189.9" height="19" rx="4" fill="#141925"/><text x="700.0" y="369.0" font-size="12" fill="#cbd5e1" font-weight="400" text-anchor="middle" dominant-baseline="central">Toma las operaciones en orden</text><rect x="776.6" y="407.0" width="302.8" height="19" rx="4" fill="#141925"/><text x="928.0" y="417.0" font-size="12" fill="#a5b4fc" font-weight="400" text-anchor="middle" dominant-baseline="central">PUT /inspecciones/{id}/resultados (modificado_en)</text><rect x="1063.1" y="455.0" width="185.8" height="19" rx="4" fill="#141925"/><text x="1156.0" y="465.0" font-size="12" fill="#7dd3fc" font-weight="400" text-anchor="middle" dominant-baseline="central">Guarda solo si es más reciente</text><rect x="900.5" y="503.0" width="55.1" height="19" rx="4" fill="#141925"/><text x="928.0" y="513.0" font-size="12" fill="#86efac" font-weight="400" text-anchor="middle" dominant-baseline="central">200 OK</text><rect x="613.5" y="551.0" width="173.0" height="19" rx="4" fill="#141925"/><text x="700.0" y="561.0" font-size="12" fill="#86efac" font-weight="400" text-anchor="middle" dominant-baseline="central">Quita la operación de la cola</text><rect x="590.5" y="599.0" width="218.9" height="19" rx="4" fill="#141925"/><text x="700.0" y="609.0" font-size="12" fill="#fcd34d" font-weight="400" text-anchor="middle" dominant-baseline="central">Reintenta en 3 s, 6 s, 12 s, 30 s, 60 s</text><rect x="575.1" y="647.0" width="249.8" height="19" rx="4" fill="#141925"/><text x="700.0" y="657.0" font-size="12" fill="#fca5a5" font-weight="400" text-anchor="middle" dominant-baseline="central">Marca la operación con error (no la borra)</text><rect x="325.2" y="695.0" width="293.5" height="19" rx="4" fill="#141925"/><text x="472.0" y="705.0" font-size="12" fill="#fca5a5" font-weight="400" text-anchor="middle" dominant-baseline="central">Aparece en Sincronización: reintentar o descartar</text></svg>