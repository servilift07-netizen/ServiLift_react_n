al">Caso de uso principal</text><ellipse cx="482.053125" cy="148" rx="15" ry="8" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.5"/><text x="507.1" y="148.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start" dominant-baseline="central">Acción incluida o extendida</text><path d="M 697.2 148.0 L 727.2 148.0" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m22c55e)"/><text x="737.2" y="148.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start" dominant-baseline="central">«include» obligatoria</text><path d="M 889.5 148.0 L 919.5 148.0" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#mf59e0b)"/><text x="929.5" y="148.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="start" dominant-baseline="central">«extend» opcional</text><g stroke="#e5e7eb" stroke-width="2.2" fill="none"><circle cx="120" cy="442.0" r="13"/><line x1="120" y1="455.0" x2="120" y2="492.0"/><line x1="96" y1="468.0" x2="144" y2="468.0"/><line x1="120" y1="492.0" x2="102" y2="522.0"/><line x1="120" y1="492.0" x2="138" y2="522.0"/></g><text x="120.0" y="540.0" font-size="14" fill="#f3f4f6" font-weight="600" text-anchor="middle" dominant-baseline="central">Cliente</text><ellipse cx="430" cy="246.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="246.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-01: Iniciar sesión</text><ellipse cx="780" cy="196.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="196.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Ingresar correo y contraseña</text><ellipse cx="780" cy="246.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="246.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Validar rol y estado activo</text><ellipse cx="780" cy="296.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="296.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Cambiar contraseña</text><ellipse cx="430" cy="418.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="409.6" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-08: Aprobar o rechazar</text><text x="430.0" y="426.4" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">cotización</text><ellipse cx="780" cy="368.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="368.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Revisar equipos y valor</text><ellipse cx="780" cy="418.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="418.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Aprobar</text><ellipse cx="780" cy="468.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="468.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Rechazar</text><ellipse cx="430" cy="540.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="540.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-20: Solicitar segunda visita</text><ellipse cx="780" cy="540.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="540.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Notificar la fecha límite</text><ellipse cx="430" cy="637.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="628.5" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-23: Consultar seguimiento</text><text x="430.0" y="645.4" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">e historial</text><ellipse cx="780" cy="612.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="604.2" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Filtrar por cotización, cliente o</text><text x="780.0" y="619.8" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">estado</text><ellipse cx="780" cy="662.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="662.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Ver historial de estados</text><ellipse cx="430" cy="759.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="750.5" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-24: Descargar informes y</text><text x="430.0" y="767.4" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">certificados</text><ellipse cx="780" cy="734.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="734.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Enlace temporal de descarga</text><ellipse cx="780" cy="784.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="784.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Informe de 1ª y 2ª visita</text><text x="550.0" y="858.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Además, todos los roles con sesión usan CU-26 Consultar tablero e indicadores y CU-27 Recibir notificaciones.</text><rect x="577.5" y="211.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="221.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="577.5" y="236.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="246.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="578.5" y="261.0" width="55.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="271.0" font-size="10" fill="#f59e0b" font-weight="400" text-anchor="middle" dominant-baseline="central">«extend»</text><rect x="577.5" y="383.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="393.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="578.5" y="408.0" width="55.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="418.0" font-size="10" fill="#f59e0b" font-weight="400" text-anchor="middle" dominant-baseline="central">«extend»</text><rect x="578.5" y="433.0" width="55.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="443.0" font-size="10" fill="#f59e0b" font-weight="400" text-anchor="middle" dominant-baseline="central">«extend»</text><rect x="577.5" y="530.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="540.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="577.5" y="614.5" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="624.5" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="578.5" y="639.5" width="55.9" height="20" rx="4" fill="#18202e" opacity="