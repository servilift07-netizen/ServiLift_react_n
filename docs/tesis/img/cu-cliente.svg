<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="876" viewBox="0 0 1100 876" font-family="Inter, sans-serif"><defs><marker id="m22c55e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="m22c55ei" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="mf59e0b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="mf59e0bi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/></marker><marker id="mcbd5e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker><marker id="mcbd5e1i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/></marker></defs><rect width="1100" height="876" rx="14" fill="#141925"/><text x="550.0" y="34" font-size="22" font-weight="700" fill="#f3f4f6" text-anchor="middle" dominant-baseline="central">Casos de uso: Cliente</text><text x="550.0" y="62" font-size="14" fill="#9ca3af" text-anchor="middle" dominant-baseline="central">Aprueba cotizaciones, solicita la segunda visita y descarga informes y certificados desde el portal.</text><rect x="250" y="90" width="830" height="740" rx="16" fill="#18202e" stroke="#3b4a63" stroke-width="1.6"/><path d="M 146.0 472.0 L 302.0 246.0" fill="none" stroke="#cbd5e1" stroke-width="1.4"/><path d="M 558.0 246.0 L 655.0 196.0" fill="none" stroke="#22c55e" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#m22c55e)"/><path d="M 558.0 246.0 L 655.0 246.0" fill="none" stroke="#22c55e" stroke-wi