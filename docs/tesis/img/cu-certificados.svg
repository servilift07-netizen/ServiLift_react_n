2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="368.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Generar PDF con código QR</text><ellipse cx="780" cy="418.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="418.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Fijar vencimiento</text><ellipse cx="780" cy="468.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="468.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Enviar al cliente</text><ellipse cx="430" cy="540.0" rx="128" ry="34" fill="#132c44" stroke="#38bdf8" stroke-width="1.6"/><text x="430.0" y="540.0" font-size="13" fill="#e0f2fe" font-weight="600" text-anchor="middle" dominant-baseline="central">CU-22: Anular certificado</text><ellipse cx="780" cy="540.0" rx="125" ry="21" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="780.0" y="540.0" font-size="12" fill="#fef3c7" font-weight="400" text-anchor="middle" dominant-baseline="central">Registrar motivo de anulación</text><text x="550.0" y="614.0" font-size="12" fill="#9ca3af" font-weight="400" text-anchor="middle" dominant-baseline="central">Además, todos los roles con sesión usan CU-26 Consultar tablero e indicadores y CU-27 Recibir notificaciones.</text><rect x="577.5" y="211.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="221.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="577.5" y="236.0" width="58.0" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y="246.0" font-size="10" fill="#22c55e" font-weight="400" text-anchor="middle" dominant-baseline="central">«include»</text><rect x="578.5" y="261.0" width="55.9" height="20" rx="4" fill="#18202e" opacity="0.95"/><text x="606.5" y=