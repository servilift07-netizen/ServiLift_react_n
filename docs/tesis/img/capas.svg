"M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="m94a3b8i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="m7dd3fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker><marker id="m7dd3fci" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/></marker><marker id="mf9a8d4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9a8d4"/></marker><marker id="mf9a8d4i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f9a8d4"/></marker></defs><rect width="1300" height="700" rx="14" fill="#141925"/><text x="650.0" y="34" font-size="22" font-weight="700" fill="#f3f4f6" text-anchor="middle" dominant-baseline="central">Arquitectura en capas del backend</text><text x="650.0" y="62" font-size="14" fill="#9ca3af" text-anchor="middle" dominant-baseline="central">Cada capa solo conoce a la de abajo</text><path d="M 200.0 200.0 L 200.0 218.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 200.0 318.0 L 200.0 336.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 200.0 436.0 L 200.0 454.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><path d="M 200.0 554.0 L 200.0 572.0" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#m94a3b8)"/><rect x="60" y="100" width="1180" height="100" rx="12" fill="#18202e" stroke="#6366f1" stroke-width="1.6"/><path d="M72 100 h268 v100 h-268 a12 12 0 0 1 -12 -12 v-76 a12 12 0 0 1 12 -12 z" fill="#1e2440" stroke="#6366f1" stroke-width="1.6"/><text x="200.0" y="140.0" font-size="16" fill="#eef2ff" font-weight="600" text-anchor="middle" dominant-baseline="central">Capa de presentación</text><text x="200.0" y="164.0" font-size="12" fill="#9ca3af" font-weight="400" font-style="italic" text-anchor="middle" dominant-baseline="central">app/routes/*.py</text><text x="800.0" y="141.6" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">auth · usuarios · clientes · cotizaciones · programacion · inspecciones · informes · certificados · seguimiento · catalogos · dashboard ·</text><text x="800.0" y="158.5" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">serializers (modelo → JSON)</text><rect x="60" y="218" width="1180" height="100" rx="12" fill="#18202e" stroke="#ef4444" stroke-width="1.6"/><path d="M72 218 h268 v100 h-268 a12 12 0 0 1 -12 -12 v-76 a12 12 0 0 1 12 -12 z" fill="#4a1414" stroke="#ef4444" stroke-width="1.6"/><text x="200.0" y="258.0" font-size="16" fill="#fee2e2" font-weight="600" text-anchor="middle" dominant-baseline="central">Capa de seguridad</text><text x="200.0" y="282.0" font-size="12" fill="#9ca3af" font-weight="400" font-style="italic" text-anchor="middle" dominant-baseline="central">app/security.py</text><text x="800.0" y="259.6" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">Contraseñas PBKDF2-SHA256 en BLOB · tokens JWT de 12 h · require_roles(...) en cada endpoint · enlaces firmados que vencen para</text><text x="800.0" y="276.4" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">fotos, firmas y PDF</text><rect x="60" y="336" width="1180" height="100" rx="12" fill="#18202e" stroke="#22c55e" stroke-width="1.6"/><path d="M72 336 h268 v100 h-268 a12 12 0 0 1 -12 -12 v-76 a12 12 0 0 1 12 -12 z" fill="#123524" stroke="#22c55e" stroke-width="1.6"/><text x="200.0" y="376.0" font-size="16" fill="#dcfce7" font-weight="600" text-anchor="middle" dominant-baseline="central">Capa de negocio</text><text x="200.0" y="400.0" font-size="12" fill="#9ca3af" font-weight="400" font-style="italic" text-anchor="middle" dominant-baseline="central">app/services/</text><text x="800.0" y="377.6" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">flujo.py: máquina de estados, consecutivos e historial · checklist.py: ítems que aplican y validaciones · reglas.py: reglas puras · pdf.py:</text><text x="800.0" y="394.4" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">informe y certificado · archivos.py</text><rect x="60" y="454" width="1180" height="100" rx="12" fill="#18202e" stroke="#f59e0b" stroke-width="1.6"/><path d="M72 454 h268 v100 h-268 a12 12 0 0 1 -12 -12 v-76 a12 12 0 0 1 12 -12 z" fill="#3d2c0c" stroke="#f59e0b" stroke-width="1.6"/><text x="200.0" y="494.0" font-size="16" fill="#fef3c7" font-weight="600" text-anchor="middle" dominant-baseline="central">Capa de persistencia</text><text x="200.0" y="518.0" font-size="12" fill="#9ca3af" font-weight="400" font-style="italic" text-anchor="middle" dominant-baseline="central">app/models.py · app/database.py</text><text x="800.0" y="504.0" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">SQLAlchemy 2 · una sesión por petición (get_db) · zona horaria -05:00 en cada conexión · migraciones con Alembic</text><rect x="60" y="572" width="1180" height="100" rx="12" fill="#18202e" stroke="#a855f7" stroke-width="1.6"/><path d="M72 572 h268 v100 h-268 a12 12 0 0 1 -12 -12 v-76 a12 12 0 0 1 12 -12 z" fill="#2a1d45" stroke="#a855f7" stroke-width="1.6"/><text x="200.0" y="612.0" font-size="16" fill="#f3e8ff" font-weight="600" text-anchor="middle" dominant-baseline="central">Capa de datos</text><text x="200.0" y="636.0" font-size="12" fill="#9ca3af" font-weight="400" font-style="italic" text-anchor="middle" dominant-baseline="central">MariaDB / MySQL</text><text x="800.0" y="622.0" font-size="13" fill="#e5e7eb" font-weight="400" text-anchor="middle" dominant-baseline="central">31 tablas, 2 vistas (v_seguimiento_equipo, v_inspeccion_item_aplica) · InnoDB con llaves foráneas</text></svg>