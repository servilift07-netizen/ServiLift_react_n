# Corre las pruebas unitarias de la app y del backend en cada push a main o a la rama de versión
# (version-2.1) y en cada pull request.
# El umbral de cobertura vive en la configuración de cada parte (vitest.config.mts y pyproject.toml):
# si la cobertura baja, el mismo comando que se usa en local falla y el job queda en rojo.
name: tests

on:
  push:
    branches: [main, version-2.1]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servilift-app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: servilift-app/package-lock.json
      - run: npm ci
      - run: npm test
      # El reporte de cobertura queda descargable desde la pestaña Actions
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: cobertura-frontend
          path: servilift-app/coverage/
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servilift-backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      # Las dependencias salen de pyproject.toml + uv.lock (--locked falla si el lock no está al día)
      - run: python -m pip install uv==0.13.0
      - run: uv sync --locked
      # Solo pruebas unitarias: la de integración (-m integracion) necesita MySQL y entra al CI en la semana 8
      - run: uv run pytest

  evidencia-individual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Commits de test por autor esta semana
        run: |
          echo "### Commits de test por autor desde el lunes" >> "$GITHUB_STEP_SUMMARY"
          git shortlog -sn --since="last Monday" HEAD -- '*tests/*' '*.test.*' '*e2e/*' >> "$GITHUB_STEP_SUMMARY"
