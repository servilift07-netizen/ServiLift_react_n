# Migraciones de la base de datos (Alembic).
# La conexión se toma del .env (app/config.py); no se escribe aquí.
#
#   alembic current                      -> revisión actual de la base
#   alembic revision -m "descripcion"    -> nueva migración (escribir upgrade/downgrade a mano)
#   alembic upgrade head                 -> aplicar migraciones pendientes
#   alembic downgrade -1                 -> deshacer la última

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
